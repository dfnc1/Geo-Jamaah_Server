services:
  postgres:
    image: postgres:17-alpine
    container_name: geo-jamaah_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geo_jamaah
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_1234
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
